<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title></title>
  <link rel="stylesheet" href="audio.css">
</head>
<div class="header">
  <form action="/login">
    <div class="wan">
      <h1>Login</h1>
    </div>
    <div class="input-l">
      <label for="username">
        <input type="text" name="username" id="username" placeholder="Username">
      </label>
    </div>
    <div class="input-l">
      <label for="password">
        <input type="password" name="password" id="password" placeholder="Password">
      </label>
    </div>
    <div class="text-1">
      <label for="remember">
        <input type="checkbox" name="remember" id="remember">
        Remember me
      </label>
      <a href="">Forgot password?</a>
    </div>
    <div class="end">
      <button type="submit">Login</button>
    </div>
    <div class="end-2">
      <p>Don't have an account? <a href="">Register</a></p>
    </div>
  </form>
</div>
</body>
</html>
